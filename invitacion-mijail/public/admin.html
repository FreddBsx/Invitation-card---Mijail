<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf5ed">
  <title>Registro de respuestas</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./admin.css">
  <script src="./admin.js" defer></script>
</head>
<body>
  <main class="admin-shell">
    <a class="back-link" href="./">← Ver invitación</a>
    <section class="admin-card">
      <p class="small-label">PANEL PRIVADO</p>
      <h1>Respuestas</h1>
      <p class="admin-intro">Ingresa la clave de administración para consultar y descargar la lista.</p>
      <form id="admin-form" class="admin-form">
        <label for="admin-token">Clave de administración</label>
        <div class="token-row"><input id="admin-token" type="password" autocomplete="current-password" required><button type="submit">Ver respuestas</button></div>
      </form>
      <p id="admin-message" class="admin-message" aria-live="polite"></p>
      <section id="results" hidden>
        <div class="results-heading"><div><p class="small-label">REGISTRO</p><h2 id="response-count">0 respuestas</h2></div><button id="download-csv" class="download-button" type="button">Descargar CSV</button></div>
        <div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Respuesta</th><th>Fecha</th></tr></thead><tbody id="response-rows"></tbody></table></div>
      </section>
    </section>
  </main>
</body>
</html>
